<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Картка студента</h1>
    </header>
    <main>
        <section>
            <form action="" method="post">
                <h2>Personal Information</h2>
                <fieldset>
                    <legend>Provide your details</legend>
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="fullname">
                    <br>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <br>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <br>
                    <label for="number">Number</label>
                    <input type="number" id="number" name="number" required>
                    <br>
                    <label for="date">Date of Birth:</label>
                    <input type="date" id="date" name="date">
                    <br>
                    <label for="radio">Gender</label>
                    <br>
                    <label for="Male">Male</label>
                    <input type="radio" id="Male" name="gender">
                    <br>
                    <label for="Female">Female</label>
                    <input type="radio" id="Male" name="gender">
                    <br>
                    <label for="checkboxes">Known Languages</label>
                    <br>
                    <label for="checkbox">Ukrainian</label>
                    <input type="checkbox" id="Ukrainian" name="language">
                    <br>
                    <label for="checkbox">English</label>
                    <input type="checkbox" id="English" name="language">
                    <br>
                    <label for="checkbox">German</label>
                    <input type="checkbox" id="German" name="language">
                    <br>
                    <label for="checkbox">Spanish</label>
                    <input type="checkbox" id="Spanish" name="language">
                    <br>
                    <label for="select">Country:</label>
                    <select name="Country" id="select">
                        <option value="Ukraine">Ukraine</option>
                        <option value="England">England</option>
                        <option value="Germany">Germany</option>
                        <option value="Spain">Spain</option>
                        <option value="Other">Other</option>
                    </select>
                    <br>
                    <br>
                    <input type="submit">

                </fieldset>
            </form>
        </section>
    </main>
</body>

</html>
